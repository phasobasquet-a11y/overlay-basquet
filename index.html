<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Básquet ABPH</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: transparent;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .scoreboard {
      width: 100%;
      max-width: 850px;
      background: linear-gradient(180deg, #07172e 0%, #030b18 100%);
      border: 3px solid #00d2ff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 210, 255, 0.2);
      padding: 12px 20px;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* HEADER */
    .header {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      border-bottom: 2px solid #00d2ff;
      padding-bottom: 6px;
      margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    /* MAIN MATCH BODY */
    .teams-container {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 15px;
    }

    /* TEAM CARD */
    .team-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .team-badge {
      background: #ffffff;
      color: #07172e;
      width: 100%;
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      font-size: 1.4rem;
      font-weight: 900;
      text-align: center;
      clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .score {
      font-family: 'Teko', sans-serif;
      font-size: 5.5rem;
      line-height: 1;
      font-weight: 700;
      color: #00f0ff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
      margin-top: 5px;
    }

    /* VS BADGE */
    .vs-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .vs {
      font-family: 'Teko', sans-serif;
      font-size: 4rem;
      line-height: 0.8;
      font-style: italic;
      color: #00d2ff;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
    }

    /* FOOTER / PERIOD */
    .footer-info {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 210, 255, 0.1);
      border-radius: 8px;
      padding: 6px 15px;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    .period-badge {
      background: #00d2ff;
      color: #030b18;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .live-badge {
      color: #ff3333;
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #ff3333;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff3333;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* RESPONSIVE DESIGN FOR MOBILE */
    @media (max-width: 600px) {
      .header { font-size: 0.85rem; }
      .team-badge { font-size: 1rem; }
      .score { font-size: 3.8rem; }
      .vs { font-size: 2.5rem; }
      .footer-info { font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <div class="scoreboard">
    <!-- TITULO SUPERIOR -->
    <div class="header">
      ASOCIACIÓN DE BASKETBALL DE PADRE HURTADO - ABPH
    </div>

    <!-- CUERPO PRINCIPAL DEL MARCADOR -->
    <div class="teams-container">
      <!-- LOCAL -->
      <div class="team-card">
        <div class="team-badge" id="nombreLocal">LOCAL</div>
        <div class="score" id="puntosLocal">0</div>
      </div>

      <!-- VERSUS -->
      <div class="vs-container">
        <div class="vs">VS</div>
      </div>

      <!-- VISITANTE -->
      <div class="team-card">
        <div class="team-badge" id="nombreVisitante">VISITANTE</div>
        <div class="score" id="puntosVisitante">0</div>
      </div>
    </div>

    <!-- FOOTER CON INFORMACIÓN EN VIVO -->
    <div class="footer-info">
      <div class="period-badge" id="periodo">4TO CUARTO - 03:45</div>
      <div class="live-badge">
        <div class="dot"></div> EN VIVO - ABPH TV
      </div>
    </div>
  </div>

  <script>
    // URL de consulta pública de tu Google Sheet en formato CSV/JSON
    const SPREADSHEET_ID = '1DGpRh3TD7cp1LaxPpIXRv3XI2sZzqgcRp-Lav3FsWic';
    // Consulta los datos directos de la pestaña EN_VIVO
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=EN_VIVO`;

    async function actualizarMarcador() {
      try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        
        // Limpia el formato JSON de Google Visualization
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        if (rows && rows.length > 0) {
          // Asumiendo Fila 2 de EN_VIVO: Col A=Local, Col B=Visitante, Col C=Pts Local, Col D=Pts Visitante
          const local = rows[0].c[0] ? rows[0].c[0].v : 'LOCAL';
          const visitante = rows[0].c[1] ? rows[0].c[1].v : 'VISITANTE';
          const ptsLocal = rows[0].c[2] ? rows[0].c[2].v : '0';
          const ptsVisitante = rows[0].c[3] ? rows[0].c[3].v : '0';

          document.getElementById('nombreLocal').innerText = local;
          document.getElementById('nombreVisitante').innerText = visitante;
          document.getElementById('puntosLocal').innerText = ptsLocal;
          document.getElementById('puntosVisitante').innerText = ptsVisitante;
        }
      } catch (err) {
        console.log("Cargando datos...", err);
      }
    }

    // Actualiza automáticamente cada 3 segundos
    setInterval(actualizarMarcador, 3000);
    actualizarMarcador();
  </script>

</body>
</html>
