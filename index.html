<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Fondo transparente para overlay */
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Arial Black', sans-serif;
      overflow: hidden;
    }

    /* Contenedor principal del tablero */
    .scoreboard-overlay {
      display: flex;
      justify-content: space-between;
      width: 100vw;
      padding: 10px 20px;
      box-sizing: border-box;
    }

    /* Estilo de los banners de los equipos */
    .team-badge {
      background-color: rgba(0, 0, 0, 0.75);
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 24px;
      text-transform: uppercase;
      border-bottom: 4px solid #FF5722; /* Accent deportivo */
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="scoreboard-overlay">
    <div id="team-local" class="team-badge">CARGANDO...</div>
    <div id="team-visit" class="team-badge">CARGANDO...</div>
  </div>

  <script>
    // URL Web App de tu Google Apps Script
    const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxxUUyVeEbeRJP2L2sZYwKQ6ZdvRrme-C9-T_NorlpoBjbd4QjGnJbOqMxfykm09WDY/exec';

    async function actualizarEquipos() {
      try {
        const response = await fetch(SHEET_API_URL);
        const data = await response.json();
        
        // Carga los equipos definidos en la pestaña EN_VIVO
        document.getElementById('team-local').innerText = data.local || 'LOCAL';
        document.getElementById('team-visit').innerText = data.visitante || 'VISITA';
      } catch (error) {
        console.error('Error al actualizar overlay:', error);
      }
    }

    // Consulta la planilla cada 3 segundos
    setInterval(actualizarEquipos, 3000);
    actualizarEquipos();
  </script>
</body>
</html>
